name: Deploy demo sites

# Publishes both medical practice demos to GitHub Pages:
#   /medweb/south-texas/  — South Texas Vascular Experts (this branch)
#   /medweb/austin-heart/ — Austin Heart & Associates (claude/austin-heart-public-url)
#
# The two sites have unrelated git histories and different toolchains, so this
# workflow checks each branch out separately and builds it on its own terms.

on:
  push:
    branches:
      - claude/medical-demo-public-urls-s3hiln
      - claude/austin-heart-public-url
  workflow_dispatch:

# Needed by actions/configure-pages to enable Pages, and by deploy-pages to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it is not already enabled, so this
          # needs no manual setup in repository settings.
          enablement: true

      # ---- Site A: South Texas Vascular Experts (Express + EJS, prerendered)
      - name: Check out South Texas Vascular
        uses: actions/checkout@v4
        with:
          ref: claude/medical-demo-public-urls-s3hiln
          path: south-texas

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build South Texas Vascular
        working-directory: south-texas
        env:
          # sqlite3 is only needed by the live Express server, never by the
          # static build — skip the one native module.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/south-texas
        run: |
          npm ci --omit=optional
          npm run build

      # ---- Site B: Austin Heart & Associates (React + Vite SPA)
      - name: Check out Austin Heart
        uses: actions/checkout@v4
        with:
          ref: claude/austin-heart-public-url
          path: austin-heart

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Austin Heart
        working-directory: austin-heart
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/austin-heart/
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # ---- Assemble both under one Pages site
      - name: Assemble site
        run: |
          mkdir -p public/south-texas public/austin-heart
          cp -r south-texas/dist/. public/south-texas/
          cp -r austin-heart/artifacts/austin-heart/dist/public/. public/austin-heart/
          cp south-texas/.github/index.html public/index.html
          echo "--- assembled ---"
          find public -maxdepth 2 -mindepth 1 -type d | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
