name: Deploy demo sites

# Publishes both medical practice demos to GitHub Pages:
#   /medweb/south-texas/  — South Texas Vascular Experts (this branch)
#   /medweb/austin-heart/ — Austin Heart & Associates (claude/austin-heart-public-url)
#
# The two sites have unrelated git histories and different toolchains, so this
# workflow checks each branch out separately and builds it on its own terms,
# then publishes the combined output to the `gh-pages` branch.
#
# Note: actions/configure-pages with enablement:true does NOT work here — the
# built-in GITHUB_TOKEN carries Pages:write but creating a Pages site for the
# first time needs repo-admin, so it fails with "Resource not accessible by
# integration". Publishing to a gh-pages branch avoids that API entirely.

on:
  push:
    branches:
      - claude/medical-demo-public-urls-s3hiln
      - claude/austin-heart-public-url
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # ---- Site A: South Texas Vascular Experts (Express + EJS, prerendered)
      - name: Check out South Texas Vascular
        uses: actions/checkout@v4
        with:
          ref: claude/medical-demo-public-urls-s3hiln
          path: south-texas

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build South Texas Vascular
        working-directory: south-texas
        env:
          BASE_PATH: /medweb/south-texas
        # sqlite3 is only needed by the live Express server, never by the
        # static build — skip the one native module.
        run: |
          npm ci --omit=optional
          npm run build

      # ---- Site B: Austin Heart & Associates (React + Vite SPA)
      - name: Check out Austin Heart
        uses: actions/checkout@v4
        with:
          ref: claude/austin-heart-public-url
          path: austin-heart

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Austin Heart
        working-directory: austin-heart
        env:
          BASE_PATH: /medweb/austin-heart/
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # ---- Assemble both under one site
      - name: Assemble site
        run: |
          rm -rf public && mkdir -p public/south-texas public/austin-heart
          cp -r south-texas/dist/. public/south-texas/
          cp -r austin-heart/artifacts/austin-heart/dist/public/. public/austin-heart/
          cp south-texas/.github/index.html public/index.html
          # Tell Pages not to run the output through Jekyll, which would drop
          # any file or directory beginning with an underscore.
          touch public/.nojekyll
          echo "--- assembled ---"
          find public -maxdepth 2 -mindepth 1 | sort

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy demo sites from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Published $(git ls-files | wc -l) files to gh-pages"
