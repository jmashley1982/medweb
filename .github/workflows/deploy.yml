name: Deploy site

# Everything lives on main now: the MedWebDev landing page and both demo
# sites. One `npm run build` assembles the lot into dist/, and this publishes
# that to the `gh-pages` branch, which is what GitHub Pages serves.
#
# GitHub Pages serves this repo under /medweb, so the build runs with
# SITE_BASE=/medweb. A Cloudflare Pages project would serve it at a domain
# root and needs no SITE_BASE at all.
#
# Note: publishing to a gh-pages branch rather than using
# actions/configure-pages is deliberate — the built-in GITHUB_TOKEN can push
# to a branch but cannot create the Pages site itself, which fails with
# "Resource not accessible by integration".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race; a newer push supersedes one already running.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # sqlite3 is needed only by the live Express server (npm start), never by
      # the static build, so skip compiling the one native module.
      - name: Install
        run: npm ci --omit=optional

      - name: Build
        env:
          SITE_BASE: /medweb
        run: npm run build

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Published $(git ls-files | wc -l) files to gh-pages"
