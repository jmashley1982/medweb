kind = "web"
previewPath = "/"
title = "Austin Heart & Associates"
version = "1.0.0"
id = "artifacts/austin-heart"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18888

[services.development]
run = "pnpm --filter @workspace/austin-heart run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/austin-heart", "run", "build" ]
publicDir = "artifacts/austin-heart/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18888"
BASE_PATH = "/"
